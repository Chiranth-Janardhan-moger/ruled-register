name: Build & Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Google Services Configuration Exists
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "549024407729",
              "project_id": "pigmibook",
              "storage_bucket": "pigmibook.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:549024407729:android:47f2390a37ebe47b00c290",
                  "android_client_info": {
                    "package_name": "com.chiranth7.regibook"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAZ2ED_sojZPXx5xct-ncvhRwvspPr_wUQ"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Ensure Keystore Exists
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release keystore for build..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ruledregisterkey -keypass ruledregisterkey \
              -dname "CN=RuledRegister, OU=Mobile, O=Amma, L=Bengaluru, ST=Karnataka, C=IN"
          fi

      - name: Build Release APK with R8
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ruledregisterkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ruledregisterkey' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Asset
        id: prepare_asset
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          fi
          
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="ruled-register-${RELEASE_TAG}.apk"
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
            echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "Error: Release APK not found at $APK_SRC"
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          APK="${{ steps.prepare_asset.outputs.apk_path }}"
          
          echo "Publishing release $TAG with asset $APK..."
          gh release create "$TAG" "$APK" \
            --title "Register Book $TAG" \
            --generate-notes \
            --draft=false \
            --prerelease=false
